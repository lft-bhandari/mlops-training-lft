name: CI - MLOps Training App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: day_three/backend

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧹 Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      # Optional: if you add tests later
      - name: 🧪 Run tests (if present)
        run: |
          if [ -d "tests" ]; then
            pip install pytest
            pytest
          else
            echo "No tests folder found, skipping tests."
          fi

  docker-build:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    needs: backend-ci

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔧 Build Backend Docker image
        run: |
          docker build -t mlops-backend ./day_three/backend

      - name: 🌐 Build Frontend Docker image
        run: |
          docker build -t mlops-frontend ./day_three/frontend
