<!DOCTYPE html>
<html>
<head>
    <title>User Task Manager</title>
</head>
<body>

    <h1>User Task Manager</h1>

    <h2>Add User</h2>
    <form id="userForm">
        <input type="text" id="username" placeholder="Username" required><br><br>
        <input type="text" id="designation" placeholder="Designation" required><br><br>
        <textarea id="tasks" placeholder="Tasks" required></textarea><br><br>
        <button type="submit">Save User</button>
    </form>

    <hr>

    <h2>Users in Database</h2>
    <button id="showUsersBtn">Show Users</button>
    <ul id="userList"></ul>

    <script src="script.js"></script>

</body>
</html>
